<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shree Giriraj ERP — Connecting...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .box {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 42px 46px;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      text-align: center;
      max-width: 480px;
      width: 90%;
      position: relative;
      z-index: 10;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-wrap {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 32px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }
    h2 {
      margin: 0 0 6px 0;
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      color: #94a3b8;
      font-size: 13.5px;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 30px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(199, 210, 254, 0.3);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .input-group {
      margin-bottom: 18px;
      position: relative;
    }
    .input-group i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      font-size: 13.5px;
      font-family: inherit;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.45);
    }
    .btn:active {
      transform: translateY(0);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="box">
    <div class="logo-wrap">
      <i class="fa-solid fa-industry"></i>
    </div>
    <h2>Shree Giriraj Poly Plast</h2>
    <p class="sub">Enterprise Resource Planning (ERP)</p>

    <div class="status-badge" id="statusBadge">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Starting backend server & connecting...</span>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-globe"></i>
      <input type="text" id="serverInput" value="http://127.0.0.1:8000" spellcheck="false" />
    </div>

    <div class="actions">
      <button class="btn" id="retryBtn" onclick="doRetry()">
        <i class="fa-solid fa-arrows-rotate"></i> Connect / Retry
      </button>
    </div>

    <div class="footer-note">
      Automated local service management enabled &bull; v2.0
    </div>
  </div>

  <script>
    let ipc = null;
    try {
      const { ipcRenderer } = require('electron');
      ipc = ipcRenderer;
    } catch (e) {}

    function updateStatus(text, isError = false) {
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const spinner = document.getElementById('spinner');

      statusText.textContent = text;
      if (isError) {
        spinner.style.display = 'none';
        statusBadge.style.background = 'rgba(239, 68, 68, 0.15)';
        statusBadge.style.borderColor = 'rgba(239, 68, 68, 0.35)';
        statusBadge.style.color = '#fca5a5';
      } else {
        spinner.style.display = 'inline-block';
        statusBadge.style.background = 'rgba(99, 102, 241, 0.12)';
        statusBadge.style.borderColor = 'rgba(99, 102, 241, 0.3)';
        statusBadge.style.color = '#c7d2fe';
      }
    }

    function doRetry() {
      const url = document.getElementById('serverInput').value.trim() || 'http://127.0.0.1:8000';
      updateStatus('Connecting to ' + url + '...');
      if (ipc) {
        ipc.send('retry-connection', url);
      } else {
        window.location.href = url;
      }
    }

    if (ipc) {
      ipc.on('connection-status', (event, data) => {
        if (data.status === 'error') {
          updateStatus(data.message || 'Server not reachable. Please retry.', true);
        } else if (data.status === 'starting') {
          updateStatus(data.message || 'Starting ERP backend server...');
        } else if (data.status === 'connected') {
          updateStatus('Connected! Launching ERP...');
        }
      });
    }
  </script>
</body>
</html>
